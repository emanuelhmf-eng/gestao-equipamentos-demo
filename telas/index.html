<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestão de Cautelas - Demo</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/dashboard.css">

    <link rel="stylesheet" href="../css/equipamentos.css">
    <link rel="stylesheet" href="../css/usuarios.css">
    <link rel="stylesheet" href="../css/identidade.css">
    <link rel="stylesheet" href="../css/dashboard-ranking.css">
    <link rel="stylesheet" href="../css/backup.css">
    <link rel="stylesheet" href="../css/backup-agendamento.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!--====================================================
    HEADER
    =====================================================-->

    <header class="topo">

        <button id="btnMenu" aria-label="Abrir ou fechar menu" aria-expanded="true">

            <i class="fa-solid fa-bars"></i>

        </button>

        <div class="statusSistema">

            <i class="fa-solid fa-circle-check"></i>

            Sistema conectado

        </div>

    </header>

    <!--====================================================
    LAYOUT
    =====================================================-->

    <div class="layout">

        <aside
        id="sidebar"
        class="sidebar">

        </aside>

        <main
            id="conteudo">

        </main>

    </div>

    <div id="modalSenhaAdministrador" class="modal modalCautela modalConfirmarCautela oculto" role="dialog" aria-modal="true" aria-labelledby="tituloSenhaAdministrador">
        <form id="formSenhaAdministrador" class="janelaModal">
            <div class="cabecalhoModal"><div><h2 id="tituloSenhaAdministrador">Confirmação do administrador</h2><p>Operação restrita</p></div><button id="fecharSenhaAdministrador" type="button" aria-label="Cancelar">&times;</button></div>
            <div class="corpoConfirmacaoCautela corpoSenhaAdministrador">
                <span class="iconeConfirmacaoCautela"><i class="fa-solid fa-key"></i></span>
                <strong>Informe sua senha</strong>
                <p id="mensagemSenhaAdministrador">Digite a senha da conta de administrador conectada para continuar.</p>
                <label><span>Senha do administrador</span><div class="campoSenhaAdministrador"><input id="senhaAdministradorOperacao" type="password" autocomplete="current-password" aria-describedby="erroSenhaAdministrador" autofocus><button id="alternarSenhaAdministrador" type="button" aria-label="Mostrar senha" title="Mostrar senha"><i class="fa-solid fa-eye"></i></button></div></label>
                <small id="erroSenhaAdministrador" class="erroConfirmacaoCautela"></small>
            </div>
            <div class="rodapeModal"><button id="cancelarSenhaAdministrador" type="button">Cancelar</button><button id="confirmarSenhaAdministrador" type="submit"><i class="fa-solid fa-shield-halved"></i> Confirmar</button></div>
        </form>
    </div>

    <script src="../js/identidade.js"></script>
    <script src="../js/pageLoader.js"></script>

    <script src="../js/app.js"></script>

    <script src="../js/menu.js"></script>

</body>

</html>
