<div class="cautela-container">

    <h1>

        Nova Cautela

    </h1>

    <div class="linha">

        <div>

            <label>Policial</label>

            <input
                id="pesquisaPolicial"
                placeholder="Pesquisar policial">

        </div>

        <div>

            <label>Senha do Policial</label>

            <input
                id="senhaPolicial"
                type="password">

        </div>

    </div>

    <hr>

    <div class="linha">

        <div>

            <label>Pesquisar Equipamento</label>

            <input
                id="pesquisaEquipamento"
                placeholder="Modelo, patrimônio, prefixo ou número de série">

        </div>

    </div>

    <table class="tabelaEquipamentos">

        <thead>

            <tr>

                <th></th>

                <th>Categoria</th>

                <th>Modelo</th>

                <th>Patrimônio</th>

                <th>Status</th>

            </tr>

        </thead>

        <tbody id="listaDisponiveis">

        </tbody>

    </table>

    <h2>

        Equipamentos Selecionados

    </h2>

    <table class="tabelaEquipamentos">

        <thead>

            <tr>

                <th>Categoria</th>

                <th>Modelo</th>

                <th>Patrimônio</th>

                <th></th>

            </tr>

        </thead>

        <tbody id="listaSelecionados">

        </tbody>

    </table>

    <div style="margin-top:25px">

        <button
            id="btnFinalizarCautela">

            Finalizar Cautela

        </button>

    </div>

</div>
